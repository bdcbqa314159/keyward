name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pinned clang-format
        run: pip install "clang-format==18.1.8"   # keep in lockstep with local (see README)
      - name: clang-format --dry-run -Werror
        shell: bash
        run: |
          shopt -s nullglob
          files=(include/keyward/*.hpp src/*.cpp tests/*.cpp)
          if [ ${#files[@]} -eq 0 ]; then echo "no sources yet — skipping"; exit 0; fi
          clang-format --version
          clang-format --dry-run -Werror "${files[@]}"

  # The matrix jobs build Release, so nothing exercises the sanitizers. This one
  # runs the whole suite under ASan + UBSan + LSan, on Linux because that's where
  # the Secret Service backend (the only code doing manual C-API lifetime work)
  # can actually run.
  # timeout-minutes on every job: a hang used to run until GitHub's 6-hour
  # default. One sanitizer job sat at 139 minutes before anyone noticed, and its
  # log stays unavailable while it is in progress — so a hang is not just slow, it
  # is undiagnosable. A ceiling turns it into a fast, readable failure.
  sanitizers:
    name: sanitizers (ASan+UBSan+LSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect CMake project
        id: detect
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then echo "cmake=true" >> "$GITHUB_OUTPUT";
          else echo "cmake=false" >> "$GITHUB_OUTPUT"; echo "No CMakeLists.txt yet — skipping."; fi

      # Same pre-configure setup as the Linux matrix job: without these the
      # Secret Service and interop tests skip, and they are precisely the ones
      # worth sanitizing.
      - name: Install Linux Secret Service deps
        if: steps.detect.outputs.cmake == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev gnome-keyring libglib2.0-bin libpolkit-gobject-1-dev

      - name: Install interop reference (Python keyring)
        if: steps.detect.outputs.cmake == 'true'
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt

      - name: Configure (asan preset)
        if: steps.detect.outputs.cmake == 'true'
        run: cmake --preset asan

      - name: Build
        if: steps.detect.outputs.cmake == 'true'
        run: cmake --build build/asan -j

      - name: Test under sanitizers
        if: steps.detect.outputs.cmake == 'true'
        env:
          # UBSan RECOVERS by default: it prints a diagnostic and carries on, so
          # the process still exits 0 and a green suite would hide real UB. The
          # asan preset now passes -fno-sanitize-recover=all; this is the belt to
          # that braces, and also covers anyone configuring without the preset.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
          # A runner's keyring is disposable, so run the host-gated Vault-over-
          # real-keyring test here too — it is the deepest path through the
          # backend and worth sanitizing.
          KEYWARD_HOST_TESTS: "1"
        run: |
          dbus-run-session -- bash -c '
            echo -n "keyward-ci" | gnome-keyring-daemon --unlock --components=secrets --daemonize
            ctest --test-dir build/asan --output-on-failure'

  # The parsers take fully attacker-controlled bytes, so they are the one part of
  # keyward worth coverage-guided fuzzing. Linux-only: Apple's clang ships the
  # -fsanitize=fuzzer flag but not the runtime.
  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect CMake project
        id: detect
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then echo "cmake=true" >> "$GITHUB_OUTPUT";
          else echo "cmake=false" >> "$GITHUB_OUTPUT"; echo "No CMakeLists.txt yet — skipping."; fi

      - name: Configure (fuzzers, Clang)
        if: steps.detect.outputs.cmake == 'true'
        run: |
          cmake -S . -B build/fuzz -DKEYWARD_BUILD_FUZZERS=ON \
            -DKEYWARD_BUILD_TESTS=OFF -DKEYWARD_BUILD_TUI=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        if: steps.detect.outputs.cmake == 'true'
        run: cmake --build build/fuzz -j

      # ~17k exec/s, so a minute is real coverage rather than a gesture. Seeded
      # from the committed corpus: seeds raised new-unit discovery by ~55% in a
      # 20s local run (188 -> 294).
      # First dir is where libFuzzer WRITES newly-discovered units; the seed dir
      # is read-only input. Passing the seed dir first would have it grow ~170
      # generated blobs per run.
      - name: Fuzz decode_fields
        if: steps.detect.outputs.cmake == 'true'
        run: |
          mkdir -p build/fuzz/found
          ./build/fuzz/fuzz_decode_fields build/fuzz/found tests/fuzz/corpus/decode_fields \
            -max_total_time=60 -print_final_stats=1

      # Fuzzable at all only because this build tree lowers the Argon2 cost
      # (KEYWARD_FUZZ_CHEAP_KDF, set only under KEYWARD_BUILD_FUZZERS). At
      # production cost this managed 12 executions in 21 seconds; it now runs at
      # ~6.5k/s over the same branches. See src/secret_box.cpp for why the
      # reduction does not change what is covered.
      - name: Fuzz unseal
        if: steps.detect.outputs.cmake == 'true'
        run: |
          mkdir -p build/fuzz/found-unseal
          ./build/fuzz/fuzz_unseal build/fuzz/found-unseal tests/fuzz/corpus/unseal \
            -max_total_time=60 -print_final_stats=1

      # The file store's actual read path: parse_encrypted_file -> base64 ->
      # aead_open on attacker bytes. unseal() above fuzzes a framing no production
      # code uses; this covers the one the encrypted file store reads.
      - name: Fuzz parse_encrypted_file
        if: steps.detect.outputs.cmake == 'true'
        run: |
          mkdir -p build/fuzz/found-pef
          ./build/fuzz/fuzz_parse_encrypted_file build/fuzz/found-pef \
            tests/fuzz/corpus/parse_encrypted_file \
            -max_total_time=60 -print_final_stats=1

      # A crash/leak/timeout writes its reproducer to the working directory;
      # without this the input that triggered it dies with the runner.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # The Secret Service backend is the code most exposed to distro variation:
  # attribute matching, `modified` timestamp granularity and lock semantics are
  # all provider behaviour, and ubuntu-latest pins one libsecret and one keyring
  # daemon. These jobs run the same suite against other distros' versions.
  #
  # Deliberately leaner than the ubuntu job: no TUI (FTXUI is not distro-sensitive
  # and fetching it doubles the build), and no Python venv, so the keyring interop
  # test skips here — interop is a vocabulary contract, not a distro one, and it
  # stays covered on ubuntu.
  distros:
    name: distro (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false   # one distro's packaging quirk must not mask the others
      matrix:
        include:
          - name: debian-stable
            image: debian:stable
            install: >-
              apt-get update -qq &&
              apt-get install -y -qq cmake g++ git pkg-config ca-certificates
              libsecret-1-dev gnome-keyring libglib2.0-bin dbus libpolkit-gobject-1-dev
          - name: fedora
            image: fedora:latest
            install: >-
              dnf -y install cmake gcc-c++ git pkgconf-pkg-config
              libsecret-devel gnome-keyring glib2 dbus-daemon dbus-tools polkit-devel
          - name: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed cmake gcc make git pkgconf
              libsecret gnome-keyring glib2 dbus polkit
    steps:
      # Before checkout on purpose: actions/checkout wants git, and these images
      # do not ship it.
      - name: Install toolchain and Secret Service
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Report versions
        run: |
          cmake --version | head -1
          echo "libsecret: $(pkg-config --modversion libsecret-1)"
          gnome-keyring-daemon --version || true

      # Container jobs run as root, and gnome-keyring REFUSES to start as root on
      # some distros ("error dropping process capabilities - -5, aborting" on
      # Fedora; Debian's build happens to tolerate it). Running unprivileged is
      # both the fix and the realistic case — nobody uses a keyring as root.
      - name: Build and test as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder .
          cat > /tmp/run.sh <<'SCRIPT'
          set -e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKEYWARD_BUILD_TUI=OFF
          cmake --build build -j
          dbus-run-session -- bash -c '
            echo -n "keyward-ci" | gnome-keyring-daemon --unlock --components=secrets --daemonize
            ctest --test-dir build --output-on-failure'
          SCRIPT
          runuser -u builder -- env HOME=/home/builder bash /tmp/run.sh

  # Proves an INSTALLED keyward is consumable, which install() succeeding does not.
  # Installs to a NON-ROOT prefix on purpose: that is the case that breaks, because
  # paths baked in at configure time silently point at /usr/local. Both supported
  # routes are exercised — find_package and pkg-config.
  package:
    name: install & consume
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libpolkit-gobject-1-dev

      # FTXUI is not packaged on the runner image, so build one SEPARATELY from
      # keyward's own build tree. That separateness is the point being tested: the
      # consumer compiles the header-only prompter against an FTXUI keyward did
      # not build, so no second copy enters the binary and no keyward TUI library
      # is involved.
      - name: Build an independent FTXUI for the consumer
        run: |
          git clone --depth 1 --branch v5.0.0 https://github.com/ArthurSonzogni/FTXUI.git /tmp/ftxui
          cmake -S /tmp/ftxui -B /tmp/ftxui/build -DCMAKE_BUILD_TYPE=Release \
            -DFTXUI_BUILD_EXAMPLES=OFF -DFTXUI_BUILD_DOCS=OFF -DFTXUI_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/ftxui-prefix"
          cmake --build /tmp/ftxui/build -j
          cmake --install /tmp/ftxui/build

      - name: Build and install to an unprivileged prefix
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DKEYWARD_BUILD_TESTS=OFF -DKEYWARD_BUILD_TUI=OFF
          cmake --build build -j
          cmake --install build --prefix "$HOME/kw-prefix"

      # A keyward package must ship keyward, not googletest or FTXUI.
      - name: Check the prefix contains only keyward's own artifacts
        run: |
          ls "$HOME/kw-prefix/lib"
          for stray in libgtest.a libgmock.a libftxui-dom.a; do
            if [ -e "$HOME/kw-prefix/lib/$stray" ]; then
              echo "::error::$stray leaked into the keyward install prefix"; exit 1
            fi
          done

      - name: Consume via find_package
        run: |
          cmake -S packaging/consumer-test -B build-consumer \
            -DCMAKE_PREFIX_PATH="$HOME/kw-prefix"
          cmake --build build-consumer -j
          ./build-consumer/consumer

      # The TUI prompter is header-only precisely so an app compiles it against
      # ITS OWN FTXUI — the one built above, not keyward's.
      - name: Consume the header-only TUI prompter against that FTXUI
        run: |
          g++ -std=c++20 -I "$HOME/kw-prefix/include" -I "$HOME/ftxui-prefix/include" \
            packaging/consumer-test/tui_main.cpp -o tui-consumer \
            -L "$HOME/ftxui-prefix/lib" -lftxui-component -lftxui-dom -lftxui-screen \
            "$HOME/kw-prefix/lib/libkeyward.a" "$HOME/kw-prefix/lib/libmonocypher.a" \
            "$HOME/kw-prefix/lib/libsodium.a" \
            $(pkg-config --libs libsecret-1 polkit-gobject-1)
          ./tui-consumer
          if [ -e "$HOME/kw-prefix/lib/libkeyward_tui.a" ]; then
            echo "::error::a keyward_tui library was installed; the TUI is meant to be header-only"
            exit 1
          fi

      # The headless-gatherer example is the answer to "can an unattended job use
      # this?" — it must keep compiling against an installed keyward, and it must
      # still work with no session bus and no terminal.
      - name: Build and run the headless gatherer example
        run: |
          export PKG_CONFIG_PATH="$HOME/kw-prefix/lib/pkgconfig"
          g++ -std=c++20 $(pkg-config --cflags keyward) examples/headless_gatherer.cpp \
            -o gatherer $(pkg-config --static --libs keyward)
          env -u DBUS_SESSION_BUS_ADDRESS \
            KEYWARD_GATHERER_WAREHOUSE_ENDPOINT=https://dw.example \
            KEYWARD_GATHERER_WAREHOUSE_TOKEN=abc123XYZ ./gatherer
          # Nothing configured must fail honestly, not half-work.
          if env -u DBUS_SESSION_BUS_ADDRESS ./gatherer; then
            echo "::error::the gatherer reported success with no credentials"; exit 1
          fi

      # keyward is a static library, so private deps only appear under --static.
      - name: Consume via pkg-config
        run: |
          export PKG_CONFIG_PATH="$HOME/kw-prefix/lib/pkgconfig"
          test -n "$(pkg-config --cflags keyward)" || { echo "::error::keyward.pc not found"; exit 1; }
          case "$(pkg-config --cflags keyward)" in
            */usr/local/*) echo "::error::keyward.pc is not relocatable — it resolved to /usr/local"; exit 1 ;;
          esac
          g++ -std=c++20 $(pkg-config --cflags keyward) packaging/consumer-test/main.cpp \
            -o pc-consumer $(pkg-config --static --libs keyward)
          ./pc-consumer

  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # No-op-green until the CMake project lands (keyward Phase 0). Once
      # CMakeLists.txt exists, the configure/build/test steps activate.
      - name: Detect CMake project
        id: detect
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then echo "cmake=true" >> "$GITHUB_OUTPUT";
          else echo "cmake=false" >> "$GITHUB_OUTPUT"; echo "No CMakeLists.txt yet — skipping build."; fi

      # Secret Service backend deps. libsecret-1-dev must be present BEFORE
      # configure (pkg-config detection happens there); gnome-keyring provides a
      # live Secret Service for the contract test to run against.
      - name: Install Linux Secret Service deps
        if: runner.os == 'Linux' && steps.detect.outputs.cmake == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev gnome-keyring libglib2.0-bin libpolkit-gobject-1-dev

      # Python `keyring` is the other side of the Secret Service interop test.
      # Must exist BEFORE configure: CMake locates the CLI with find_program and
      # bakes its path in, so a venv created later would leave the test skipping.
      - name: Install interop reference (Python keyring)
        if: runner.os == 'Linux' && steps.detect.outputs.cmake == 'true'
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt

      # Windows counterpart: the other side of the Credential Manager interop test.
      # Same rule — the venv must exist BEFORE configure so find_program bakes in
      # the .venv/Scripts/keyring.exe path; a later venv would leave the test
      # skipping. WinVaultKeyring needs no extra service (Credential Manager is
      # always present), unlike the Linux Secret Service.
      - name: Install interop reference (Python keyring, Windows)
        if: runner.os == 'Windows' && steps.detect.outputs.cmake == 'true'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q -r requirements-dev.txt

      - name: Configure
        if: steps.detect.outputs.cmake == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.detect.outputs.cmake == 'true'
        run: cmake --build build --config Release -j

      - name: Test
        if: steps.detect.outputs.cmake == 'true' && runner.os != 'Linux'
        run: ctest --test-dir build --build-config Release --output-on-failure

      # A GitHub runner is headless: no session bus, no keyring daemon. Start
      # both so the Secret Service contract test runs for real instead of
      # skipping. The password on stdin must be NON-EMPTY: with an empty one
      # gnome-keyring refuses to create the login keyring itself and delegates to
      # the GTK prompter, which exits 1 with no display — every call then fails
      # with 'Object does not exist at path .../collection/login'. The value is
      # arbitrary; this keyring is thrown away with the runner.
      - name: Test (Linux, with a live Secret Service)
        if: steps.detect.outputs.cmake == 'true' && runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n "keyward-ci" | gnome-keyring-daemon --unlock --components=secrets --daemonize
            ctest --test-dir build --build-config Release --output-on-failure'
